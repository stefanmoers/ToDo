spring:
  application:
    name: ultimatetodo
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${BACKEND_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  shutdown: graceful
  # Hinter dem nginx-Proxy die echte Client-Adresse (X-Forwarded-For) verwenden; nur interne Proxys werden vertraut.
  forward-headers-strategy: native
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        name: ULTIMATETODO_SESSION
        http-only: true
        same-site: lax
        # Im HTTPS-Betrieb zwingend true; nur der lokale HTTP-Lernbetrieb setzt false.
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read_only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    root: INFO
    org.springframework.security: WARN

springdoc:
  api-docs:
    # Die OpenAPI-Beschreibung ist nur im Entwicklungsprofil und in Tests öffentlich (siehe application-dev.yml).
    enabled: false
  swagger-ui:
    enabled: false

app:
  rate-limit:
    # Ratenbegrenzung ohne dauerhafte Sperre (US-141): höchstens so viele Versuche je Zeitfenster.
    login-attempts: 10
    login-window: 15m
    register-attempts: 10
    register-window: 1h
    password-change-attempts: 5
    password-change-window: 15m
