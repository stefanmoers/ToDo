spring:
  application:
    name: ultimatetodo
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${BACKEND_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  shutdown: graceful

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read_only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    root: INFO
    org.springframework.security: WARN
