server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # API und minimaler Healthcheck gehen an das Backend (gleiche Origin, kein CORS nötig).
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $remote_addr;  # Client-Angaben nie übernehmen (Ratenbegrenzung)
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }
    location = /actuator/health {
        proxy_pass http://backend:8081;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }
    # Alle übrigen Betriebsendpunkte sind von außen nicht erreichbar.
    location /actuator/ {
        return 404;
    }
    # API-Dokumentation ist nicht öffentlich (nur im Entwicklungsprofil des Backends).
    location /v3/ {
        return 404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri /index.html;
    }
}
