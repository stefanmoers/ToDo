name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, Unit- und Integrationstests (Testcontainers)
        run: ./src/backend/mvnw -B -f src/backend/pom.xml verify

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: src/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm --prefix src/frontend ci
      - run: npm --prefix src/frontend run lint
      - run: npm --prefix src/frontend run typecheck
      - run: npm --prefix src/frontend run test:unit
      - run: npm --prefix src/frontend run build

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: src/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm --prefix src/frontend ci
      - run: npx --prefix src/frontend playwright install --with-deps chromium
      - name: E2E und Barrierefreiheit (isolierter Compose-Stack)
        run: ./scripts/e2e.sh
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: src/frontend/playwright-report
